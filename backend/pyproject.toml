[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appointment-agent-backend"
version = "0.1.0"
description = "Appointment Reminder Agent - Phase 1 backend (calendar sync, reminder scheduler, core models)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "email-validator>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
google = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
